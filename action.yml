name: "AgentContextMap"
description: "Map coding-agent instruction files and optionally fail CI on high-confidence active conflicts."
author: "BLCCoreStudio"

branding:
  icon: "map"
  color: "purple"

inputs:
  path:
    description: "Repository path to inspect. It must already be checked out and stay inside GITHUB_WORKSPACE."
    required: false
    default: "."
  target:
    description: "Optional target path used to resolve path-specific instruction sources."
    required: false
    default: ""
  format:
    description: "Report format written to the Actions log: terminal or json."
    required: false
    default: "terminal"
  sarif:
    description: "Optional workspace-relative path for a SARIF 2.1.0 report, for example agentcontext.sarif."
    required: false
    default: ""
  fail-on-conflict:
    description: "Set to true to fail with exit code 2 when a high-confidence active conflict is found."
    required: false
    default: "false"
  job-summary:
    description: "Set to false to disable the AgentContextMap report in the GitHub Actions job summary."
    required: false
    default: "true"

outputs:
  sarif:
    description: "Absolute path to the generated SARIF report when the sarif input is set."
    value: ${{ steps.run.outputs.sarif }}

runs:
  using: "composite"
  steps:
    - name: Run AgentContextMap
      id: run
      shell: bash
      env:
        AGENTCONTEXT_ACTION_REF: ${{ github.action_ref }}
        AGENTCONTEXT_INPUT_PATH: ${{ inputs.path }}
        AGENTCONTEXT_INPUT_TARGET: ${{ inputs.target }}
        AGENTCONTEXT_INPUT_FORMAT: ${{ inputs.format }}
        AGENTCONTEXT_INPUT_SARIF: ${{ inputs.sarif }}
        AGENTCONTEXT_INPUT_FAIL_ON_CONFLICT: ${{ inputs.fail-on-conflict }}
        AGENTCONTEXT_INPUT_JOB_SUMMARY: ${{ inputs.job-summary }}
      run: bash "$GITHUB_ACTION_PATH/action-entrypoint.sh"
