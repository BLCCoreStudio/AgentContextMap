name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl target
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build portable Linux binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Verify binary
        run: ./target/x86_64-unknown-linux-musl/release/agentcontext --version

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE="AgentContextMap-${VERSION}-linux-x86_64-musl.tar.gz"
          tar -C target/x86_64-unknown-linux-musl/release -czf "$ARCHIVE" agentcontext
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          First public alpha of AgentContextMap.

          Highlights:
          - maps repository instructions for Codex/AGENTS.md, Claude Code, Gemini, GitHub Copilot, Cursor, Windsurf and Cline
          - resolves target-specific instruction scopes
          - flags deterministic conflicts and duplicate directives
          - emits text, JSON and self-contained HTML reports
          - runs locally without executing repository instructions or sending repository content to an external service

          Linux asset: portable x86_64 musl binary packaged as a tar.gz archive.
          EOF

          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --title "AgentContextMap $GITHUB_REF_NAME" \
            --prerelease \
            --notes-file /tmp/release-notes.md
