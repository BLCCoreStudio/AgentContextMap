name: Action smoke

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agentcontext-action-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  action-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build current Action binary
        run: cargo build --release --locked

      - name: Verify current development version
        shell: bash
        run: |
          set -euo pipefail
          test "$(./target/release/agentcontext --version)" = "agentcontext 0.2.0-alpha.1"

      - name: Create instruction fixture
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/.tmp/action-fixture"
          mkdir -p "$ROOT/src/api"
          printf 'Always run tests before committing.\n' > "$ROOT/AGENTS.md"
          printf 'Never run tests before committing.\n' > "$ROOT/src/AGENTS.md"
          touch "$ROOT/src/api/auth.rs"

      - name: Run Action with SARIF output
        id: sarif
        uses: ./
        with:
          path: .tmp/action-fixture
          target: src/api/auth.rs
          format: json
          sarif: .tmp/agentcontext.sarif

      - name: Assert Action SARIF output
        shell: bash
        env:
          SARIF_PATH: ${{ steps.sarif.outputs.sarif }}
        run: |
          set -euo pipefail
          test "$SARIF_PATH" = "$GITHUB_WORKSPACE/.tmp/agentcontext.sarif"
          test -f "$SARIF_PATH"
          grep -F '"version":"2.1.0"' "$SARIF_PATH"
          grep -F '"ruleId":"ACM001"' "$SARIF_PATH"

      - name: Verify conflict gate
        id: conflict-gate
        continue-on-error: true
        uses: ./
        with:
          path: .tmp/action-fixture
          target: src/api/auth.rs
          fail-on-conflict: "true"

      - name: Assert conflict gate failed as designed
        if: always()
        shell: bash
        env:
          GATE_OUTCOME: ${{ steps.conflict-gate.outcome }}
        run: |
          set -euo pipefail
          test "$GATE_OUTCOME" = "failure"
