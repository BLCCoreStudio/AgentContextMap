name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "test/**", "chore/**", "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agentcontext-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release

      - name: CLI smoke test
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT="$(mktemp -d)"
          mkdir -p \
            "$TEST_ROOT/src/api" \
            "$TEST_ROOT/.github/instructions" \
            "$TEST_ROOT/.cursor/rules" \
            "$TEST_ROOT/.windsurf/rules" \
            "$TEST_ROOT/.clinerules" \
            "$TEST_ROOT/docs"

          printf 'Always run tests before committing.\nUse npm for JavaScript dependencies.\n' > "$TEST_ROOT/AGENTS.md"
          printf 'Never run tests before committing.\nUse pnpm for JavaScript dependencies.\n' > "$TEST_ROOT/src/AGENTS.md"
          printf 'Read @./docs/claude.md before changes.\n' > "$TEST_ROOT/CLAUDE.md"
          printf 'Prefer small, focused changes.\n' > "$TEST_ROOT/docs/claude.md"
          printf 'Prefer explicit types.\n' > "$TEST_ROOT/GEMINI.md"
          printf '%s\n' '---' 'applyTo: "src/**"' '---' 'Do not modify generated files.' > "$TEST_ROOT/.github/instructions/source.instructions.md"
          printf '%s\n' '---' 'globs: "src/api/**"' 'alwaysApply: false' '---' 'API changes must include tests.' > "$TEST_ROOT/.cursor/rules/api.mdc"
          printf '%s\n' '---' 'trigger: glob' 'globs: src/api/**' '---' 'Use typed API errors.' > "$TEST_ROOT/.windsurf/rules/api.md"
          printf '%s\n' '---' 'paths:' '  - "src/api/**"' '---' 'Keep handlers small.' > "$TEST_ROOT/.clinerules/api.md"
          touch "$TEST_ROOT/src/api/auth.rs"

          ./target/release/agentcontext "$TEST_ROOT" --target src/api/auth.rs > /tmp/agentcontext.txt
          grep -q 'Sources: 8' /tmp/agentcontext.txt
          grep -q 'Findings: 2' /tmp/agentcontext.txt
          grep -q 'Status: active' /tmp/agentcontext.txt
          grep -q 'Imports:' /tmp/agentcontext.txt

          ./target/release/agentcontext "$TEST_ROOT" --target src/api/auth.rs --json > /tmp/agentcontext.json
          grep -q '"source_count":8' /tmp/agentcontext.json
          grep -q '"status":"active"' /tmp/agentcontext.json
          grep -q 'docs/claude.md' /tmp/agentcontext.json

          ./target/release/agentcontext "$TEST_ROOT" --target src/api/auth.rs --html /tmp/agentcontext.html > /dev/null
          test -s /tmp/agentcontext.html
          grep -q 'This page is a report viewer' /tmp/agentcontext.html
          grep -q 'source-toggle' /tmp/agentcontext.html
          grep -q 'Highlight involved sources' /tmp/agentcontext.html

          set +e
          ./target/release/agentcontext "$TEST_ROOT" --target src/api/auth.rs --fail-on-conflict > /dev/null
          STATUS=$?
          set -e
          test "$STATUS" -eq 2

      - name: Browser report interaction test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright==1.55.0
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            python3 -m playwright install chromium
          fi
          REPORT=/tmp/agentcontext.html BROWSER="$BROWSER" python3 - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          report = Path(os.environ['REPORT']).resolve()
          browser_path = os.environ.get('BROWSER') or None

          def visible_paths(page):
              return page.locator('.source:visible').evaluate_all(
                  "cards => cards.map(card => card.dataset.path)"
              )

          with sync_playwright() as p:
              args = {'headless': True}
              if browser_path:
                  args['executable_path'] = browser_path
              browser = p.chromium.launch(**args)
              page = browser.new_page(viewport={'width': 1440, 'height': 1200})
              page.goto(report.as_uri())

              assert page.locator('.source').count() == 8
              assert len(visible_paths(page)) == 8

              toggle = page.locator('.source-toggle').first
              details_id = toggle.get_attribute('aria-controls')
              toggle.click()
              assert toggle.get_attribute('aria-expanded') == 'true'
              details = page.locator(f'#{details_id}')
              assert details.is_visible()
              assert 'Instruction text' in details.inner_text()
              toggle.click()
              assert toggle.get_attribute('aria-expanded') == 'false'
              assert not details.is_visible()

              page.locator('.filter[data-agent="cursor"]').click()
              paths = visible_paths(page)
              assert '.cursor/rules/api.mdc' in paths
              assert 'AGENTS.md' in paths
              assert 'src/AGENTS.md' in paths
              assert '.clinerules/api.md' not in paths

              page.locator('.filter[data-agent="all"]').click()
              search = page.locator('#sourceSearch')
              search.fill('claude')
              assert visible_paths(page) == ['CLAUDE.md']
              search.fill('')

              page.locator('#statusFilter').select_option('active')
              assert len(visible_paths(page)) == 8
              page.locator('#statusFilter').select_option('all')

              page.locator('.finding-jump').first.click()
              highlighted = page.locator('.source.highlight').evaluate_all(
                  "cards => cards.map(card => card.dataset.path).sort()"
              )
              assert highlighted == ['AGENTS.md', 'src/AGENTS.md']
              page.locator('.clear-highlight').click()
              assert page.locator('.source.highlight').count() == 0

              search.fill('definitely-no-such-source')
              assert len(visible_paths(page)) == 0
              assert page.locator('#noResults').evaluate("node => node.classList.contains('show')")

              browser.close()

          print('Browser report interaction test: PASS')
          PY

      - name: Format
        run: cargo fmt --all -- --check
