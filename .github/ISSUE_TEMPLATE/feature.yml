name: Feature request
description: Propose a focused improvement to AgentContextMap.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        AgentContextMap prioritizes correctness and explainability over feature count. Please describe the concrete workflow the feature would improve.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Instruction discovery / semantics
        - Conflict detection
        - CLI / JSON output
        - HTML report
        - GitHub Actions / CI
        - Packaging / installation
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: vendor-doc
    attributes:
      label: Vendor documentation
      description: Required when the proposal changes how an agent's instruction semantics are modeled.
      placeholder: https://...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional workarounds or simpler approaches you considered.
