changelog:
  exclude:
    labels:
      - ignore-for-release

  categories:
    - title: "🚨 Breaking Changes"
      labels:
        - breaking

    - title: "🔒 Security"
      labels:
        - security

    - title: "✨ Features"
      labels:
        - enhancement

    - title: "🐛 Fixes"
      labels:
        - bug

    - title: "📦 Dependencies"
      labels:
        - dependencies

    - title: "📚 Documentation"
      labels:
        - documentation

    - title: "🧪 Tests"
      labels:
        - tests

    - title: "🛠 Maintenance"
      labels:
        - maintenance
        - github-actions

    - title: "Other Changes"
      labels:
        - "*"
